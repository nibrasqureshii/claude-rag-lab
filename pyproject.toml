[project]
name = "claude-rag-lab"
version = "0.1.0"
description = "An educational, observable RAG (Retrieval-Augmented Generation) lab built on Claude."
requires-python = ">=3.11"
dependencies = [
    "anthropic>=0.39.0",
    "streamlit>=1.39.0",
    "chromadb>=0.5.20",
    "sentence-transformers>=3.2.0,<4.0.0",
    "transformers>=4.44.0,<4.50.0",
    "torch>=2.2.0,<2.3.0",
    "numpy<2.0.0",
    "python-dotenv>=1.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["app*"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
